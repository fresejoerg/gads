[project]
name = "gads"
version = "0.1.0"
description = "A repo for developing and sharing Data Science tools and methods that utilize generative AI capabilities"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.0",
    "openai>=2.14.0",
    "pandas>=2.3.3",
    "scikit-learn>=1.8.0",
    "scipy>=1.16.3",
    "seaborn>=0.13.2",
    "tabulate>=0.9.0",
    "tqdm>=4.67.1",
    "litellm>=1.83.9",
    "pydantic>=2.10.6",
    "instructor>=1.15.1",
    "python-dotenv>=1.0.1",
    "httpx>=0.28.1",
    "sqlmodel>=0.0.22",
    "psycopg2-binary>=2.9.10",
    "chainlit>=2.1.0",
    "websockets>=14.2",
    "asyncpg>=0.30.0",
    "streamlit>=1.56.0",
    "streamlit-ace>=0.1.1",
    "langfuse<3.0.0",
    "pyyaml>=6.0.3",
    "jinja2>=3.1.0",
    "plotly>=6.0.0",
    "kaleido>=0.2.1",
    "leather>=0.4.1",
    "pygal>=3.1.0",
    "markdown>=3.10.2",
    "fastembed>=0.8.0",
]
